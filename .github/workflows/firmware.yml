# Builds the firmware (app/build/bfxr.fwsc) on GitHub with the shared FM-1 builder, which installs JieLi's toolchain and
# SDK. Every push builds it (the package is in the run's "packages" artifact); a tag vX.Y publishes it as a release.
name: Build firmware

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v[0-9]*']

permissions: {}

jobs:
  firmware:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      build: |
        set -euo pipefail
        git submodule update --init --recursive
        sudo apt-get install -y -qq libfribidi0
        ./build.sh --release "$(cat app/VERSION)"   # (the version: app/VERSION)
      test: |
        set -euo pipefail
        ./build.sh --host
        app/build/host/bfxr_host app/tests/basic.txt app/build/host
        git clone -q --depth 1 https://github.com/increpare/bfxr2 "$RUNNER_TEMP/bfxr2"
        node tools/gen_ref.js "$RUNNER_TEMP/bfxr2" "$RUNNER_TEMP/ref"
        cc -O2 -ffp-contract=off -I base/include -I app -o "$RUNNER_TEMP/check_engine" tools/check_engine.c app/bfxr.c -lm
        "$RUNNER_TEMP/check_engine" "$RUNNER_TEMP/ref" || true   # (two TAN cases differ by design: see the file)
        node tools/library_test.mjs "$RUNNER_TEMP/bfxr2"
      packages: app/build/bfxr*.fwsc

  # The site with the web installer and the in-browser emulator, on GitHub Pages (Settings > Pages > Source: GitHub
  # Actions), from this branch: https://nickhelliot.github.io/Bfm-1xr/
  site:
    needs: firmware
    if: github.ref == 'refs/heads/claude/bfxr-firmware' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages and FriBiDi (the fonts)
        run: |
          python3 -m pip install Pillow
          sudo apt-get install -y -qq libfribidi0
      - name: Emscripten 6.0.10 (the emulator)
        run: |
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout -q a2b92777574c2feda07994cd4f1079a3dfc151f8
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dl
      - name: The site
        run: |
          set -euo pipefail
          set +u; source "$RUNNER_TEMP/emsdk/emsdk_env.sh"; set -u
          version=$(cat app/VERSION)
          ./build.sh --web
          python3 base/tools/make_site.py app "dl/app/build/bfxr-$version.fwsc" "$version" _site
          # the Library page, with bfxr2's library (MIT) at a fixed commit to play and render the sounds
          mkdir -p _site/library
          cp web/library/index.html _site/library/
          git clone -q https://github.com/increpare/bfxr2 "$RUNNER_TEMP/bfxr2"
          git -C "$RUNNER_TEMP/bfxr2" checkout -q 43c6c3b15e76407e9863b999741340999225e21f
          cp "$RUNNER_TEMP/bfxr2/lib/bfxrlib.min.js" "$RUNNER_TEMP/bfxr2/LICENSE" _site/library/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
