# BFXR's build settings (base/tools/build.py)
name = "BFXR"                  # the build's files: app/build/bfxr.fwsc
id_prefix = "FM-1_62"          # package identity: dev FM-1_6200, releases FM-1_62XXYYZZ
usb_manufacturer = "BFXR"
usb_product = "BFXR FM-1"
o2 = ["bfxr.c"]                # the sound engine, compiled at -O2
words = "words.tsv"
ble = false                    # no Bluetooth: USB MIDI only
# the site and firmware.json
tagline = "bfxr.net's sound effects on the FM-1"
repo = "https://github.com/nickhelliot/Bfm-1xr"
licence = "MIT"
credits = "The sound engine and generators are bfxr2 by Stephen Lavelle (MIT), from Thomas Vian's SfxrSynth (Apache-2.0), on fm1-base by Charles Vestal (MPL-2.0)."
author = "Elliot"
description = "Make bfxr.net's game sound effects on the FM-1: pick a kind of sound (coin, laser, explosion, powerup, hit, jump, blip, random), mutate it, edit all 32 of bfxr's parameters, and play it from the keys."
tags = ["synth"]
