# BFMXR's build settings (base/tools/build.py)
name = "BFMXR"                  # the build's files: app/build/bfmxr.fwsc
id_prefix = "FM-1_62"          # package identity: dev FM-1_6200, releases FM-1_62XXYYZZ
usb_manufacturer = "BFMXR"
usb_product = "BFMXR FM-1"
o2 = ["bfxr.c", "synths.c"]   # the sound engines, compiled at -O2
words = "words.tsv"
ble = false                    # no Bluetooth: USB MIDI only
ram_layout = "packed"          # the RAM code, .data/.bss and the pool in one budget (the synths' state is big)
# the site and firmware.json
tagline = "bfxr.net's sound effects on the FM-1"
repo = "https://github.com/nickhelliot/Bfm-1xr"
licence = "MIT"
credits = "The sound engines, generators and synths are bfxr2 by Stephen Lavelle (MIT), from Thomas Vian's SfxrSynth (Apache-2.0), on fm1-base by Charles Vestal (MPL-2.0)."
author = "Elliot"
description = "Make bfxr.net's game sound effects on the FM-1: pick a kind of sound (coin, laser, explosion, powerup, hit, jump, blip, random), mutate it, edit all 32 of bfxr's parameters, and play it from the keys. ENV opens bfxr.net's other synths: Whooshr, Choirr, Breathr, Birdr, Bouncr, Swarmr, Machinr, Crittr, Zappr, Signlr, Pluckr, Rustlr, Squishr, Clonkr, Boomr, Fractr, Riftr and Glitchr."
tags = ["synth"]
install = "https://nickhelliot.github.io/Bfm-1xr/install/"
site = "https://nickhelliot.github.io/Bfm-1xr/"
screenshot = "docs/screen.png"   # a square PNG of the screen (the simulator's)
